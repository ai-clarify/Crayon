[package]
name = "crayon-rs"
version = "0.3.0"
edition = "2021"
description = "A small coordinator-based distributed task runtime"
license = "MIT"
repository = "https://github.com/ai-clarify/Crayon"
readme = "README.md"
keywords = ["distributed", "task", "scheduler", "rust"]
categories = ["concurrency"]

[lib]
name = "crayon"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
futures = "0.3"
serde_json = "1"

[[bin]]
name = "crayon-cluster"
path = "src/bin/crayon_cluster.rs"

[[bin]]
name = "cluster-benchmark"
path = "src/bin/cluster_benchmark.rs"
