[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "crayon"
version = "0.1.0"
description = "Python bindings for Crayon — a Rust reimplementation of Ray's core distributed computing framework"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "crayon"
