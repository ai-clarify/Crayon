[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "crayon-dist"
version = "0.1.1"
description = "Python bindings for Crayon — a Rust reimplementation of Ray's core distributed computing framework for RL training infrastructure"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ray", "distributed", "rl", "actor", "scheduling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "crayon"
