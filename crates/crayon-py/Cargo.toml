[package]
name = "crayon-py"
version = "0.1.1"
edition = "2021"
description = "PyO3 Python bindings for the Crayon distributed runtime"
license = "MIT"

[lib]
name = "crayon_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
crayon_rs = { path = "../..", package = "crayon-rs" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
hex = "0.4"
futures = "0.3"
