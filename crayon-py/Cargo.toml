[package]
name = "crayon-py"
version = "0.4.0"
edition = "2021"
description = "Python client for the Crayon distributed task runtime"
license = "MIT"

[lib]
name = "crayon"
crate-type = ["cdylib"]

[dependencies]
crayon-rs = { path = ".." }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
