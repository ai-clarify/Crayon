services:
  coordinator:
    build: .
    command: ["coordinator", "0.0.0.0:7000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7000'"]
      interval: 1s
      timeout: 1s
      retries: 20

  worker:
    build: .
    command: ["worker", "coordinator:7000", "worker:7001"]
    depends_on:
      coordinator:
        condition: service_healthy

  acceptance:
    build: .
    command: ["submit", "coordinator:7000", "20", "22"]
    depends_on:
      - worker
    restart: "no"
