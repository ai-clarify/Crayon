services:
  coordinator:
    build: .
    command: ["coordinator", "0.0.0.0:7000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7000'"]
      interval: 1s
      timeout: 1s
      retries: 20

  worker:
    build: .
    command: ["worker", "coordinator:7000", "worker:7001"]
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7001'"]
      interval: 1s
      timeout: 1s
      retries: 20

  acceptance:
    build: .
    command:
      - sh
      - -c
      - "for i in $(seq 1 20); do crayon-cluster submit coordinator:7000 20 22 && exit 0; sleep 1; done; exit 1"
    depends_on:
      worker:
        condition: service_healthy
    restart: "no"
